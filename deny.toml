# cargo-deny: licenses, bans, sources and advisories. Run with `cargo deny check`.

[advisories]
version = 2
# Both come in through biscuit-auth 6, the latest stable release. Remove these
# once biscuit-auth 7 is stable. Keep in sync with .cargo/audit.toml.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 timing leak is in biscuit's P-256 path; ironwrit only generates Ed25519 keys." },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained but compile-time only, via biscuit-quote; no upstream replacement yet." },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
