[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SupreetTadeparti/ironwrit"

[workspace.dependencies]
ironwrit-token = { path = "crates/ironwrit-token" }
ironwrit-ledger = { path = "crates/ironwrit-ledger" }
ironwrit-gateway = { path = "crates/ironwrit-gateway" }

anyhow = "1"
biscuit-auth = "6"
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
idna = "1"
percent-encoding = "2"
proptest = "1"
rmcp = { version = "3.8", default-features = false, features = ["client", "elicitation", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
which = "8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
