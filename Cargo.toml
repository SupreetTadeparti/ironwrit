[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SupreetTadeparti/tollgate"

[workspace.dependencies]
tollgate-token = { path = "crates/tollgate-token" }
tollgate-ledger = { path = "crates/tollgate-ledger" }
tollgate-gateway = { path = "crates/tollgate-gateway" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
